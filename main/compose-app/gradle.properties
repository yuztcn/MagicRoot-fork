org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.enableR8.fullMode=true
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.code.style=official


# Gradle configuration cache (see Gradle 9.6.0 userguide/configuration_cache_enabling):
# - stores the task graph after configuration and reuses it on later builds;
# - parallel=true also caches the parallel configuration phase;
# - problems=warn keeps unsupported build-logic from failing the build while
#   the cache is still being adopted.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

kotlin.compiler.execution.strategy=in-process

